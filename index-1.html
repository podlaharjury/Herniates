<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Щоденник відновлення спини</title>
<meta name="theme-color" content="#2D5E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Спина">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#E3E8E4; --ink:#18221F; --muted:#5B6863; --line:#D3DAD5;
  --pine:#2D5E4F; --pine-soft:#DCE9E3; --nerve:#C4405F; --nerve-soft:#F7DFE5; --amber:#A8700F; --amber-soft:#F6E8C8;
  --on-pine:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1A211E; --sunk:#232C28; --ink:#E4EBE7; --muted:#9AA8A2; --line:#2F3A35;
    --pine:#7FC0A8; --pine-soft:#1F3A31; --nerve:#F07D98; --nerve-soft:#3F2029; --amber:#E6B04E; --amber-soft:#3B2E13;
    --on-pine:#0E1A15; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --sunk:#232C28; --ink:#E4EBE7; --muted:#9AA8A2; --line:#2F3A35;
  --pine:#7FC0A8; --pine-soft:#1F3A31; --nerve:#F07D98; --nerve-soft:#3F2029; --amber:#E6B04E; --amber-soft:#3B2E13;
  --on-pine:#0E1A15; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.num{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;max-width:640px;margin:0 auto}
.brand{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--muted);text-align:right}
.sync.err{color:var(--nerve)}

main{max-width:640px;margin:0 auto;padding:0 14px 110px}
.card{background:var(--surface);border-radius:20px;padding:18px 18px 20px;margin:12px 0}
.card h2{font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.field{margin-top:18px}
.field > label, .flabel{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.hint{font-size:13px;color:var(--muted)}

/* date switcher */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 2px}
.daynav .d{text-align:center;flex:1}
.daynav .d b{display:block;font-size:20px;letter-spacing:-.01em}
.daynav .d span{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.linkbtn{border:0;background:none;color:var(--pine);font-weight:600;padding:4px 0;font-size:14px}

/* pain score */
.score{display:flex;align-items:center;gap:14px}
.score .big{font-size:34px;font-weight:700;min-width:58px;line-height:1}
.score .big.unset{color:var(--line)}
.score .meta{flex:1}
.score .word{font-size:13px;color:var(--muted);margin-top:4px}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--pine-soft),var(--nerve-soft) 55%,var(--nerve))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--pine-soft),var(--nerve-soft) 55%,var(--nerve))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
input[type=range].unset::-webkit-slider-thumb{border-color:var(--line)}
input[type=range].unset::-moz-range-thumb{border-color:var(--line)}

/* nerve path: the signature element */
.nerve{position:relative;margin-top:6px}
.nerve button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:0;text-align:left;min-height:46px}
.nerve .rail{position:relative;width:26px;align-self:stretch;display:flex;justify-content:center}
.nerve .rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;border-radius:2px;background:var(--sunk)}
.nerve button:first-child .rail::before{top:50%}
.nerve button:last-child .rail::before{bottom:50%}
.nerve .on .rail::before{background:var(--nerve)}
.nerve .end .rail::before{background:linear-gradient(var(--nerve) 50%,var(--sunk) 50%)}
.nerve button:last-child.end .rail::before{background:var(--nerve)}
.nerve button[data-v="1"].on .rail::before{background:linear-gradient(var(--sunk) 50%,var(--nerve) 50%)}
.nerve button[data-v="1"].end .rail::before{background:var(--sunk)}
.nerve .dot{position:relative;align-self:center;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--sunk)}
.nerve .on .dot{border-color:var(--nerve);background:var(--nerve)}
.nerve .end .dot{width:22px;height:22px;box-shadow:0 0 0 6px var(--nerve-soft)}
.nerve .zero .dot{border-color:var(--pine);background:var(--pine);box-shadow:0 0 0 6px var(--pine-soft)}
.nerve .lbl{font-size:15px}
.nerve .lbl small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.nerve .on .lbl,.nerve .zero .lbl{font-weight:600}

/* segmented */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:0;border:0;border-radius:12px;background:var(--sunk);padding:10px 4px;font-size:14px;min-height:44px}
.seg button.on{background:var(--ink);color:var(--surface);font-weight:600}
.seg.react button.on[data-v="1"]{background:var(--pine);color:var(--on-pine)}
.seg.react button.on[data-v="-1"]{background:var(--nerve);color:var(--surface)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea.inp{min-height:84px;resize:vertical}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--pine)}

details.flags{margin-top:18px;border-radius:14px;background:var(--amber-soft);padding:2px 14px}
details.flags summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.flags summary::-webkit-details-marker{display:none}
details.flags summary::after{content:"+";font-weight:700}
details.flags[open] summary::after{content:"–"}
details.flags label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px}
details.flags input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--nerve)}
.alert{border-radius:14px;background:var(--nerve);color:var(--surface);padding:14px 16px;margin-top:14px;font-weight:500}
.alert b{display:block;font-size:16px;margin-bottom:2px}

/* exercises */
.ex{padding:16px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex .name{font-weight:600;font-size:16px}
.ex .target{font-size:13px;color:var(--muted);white-space:nowrap}
.ex .note{font-size:13px;color:var(--muted);margin-top:2px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-width:52px;height:44px;border-radius:22px;border:2px dashed var(--line);background:none;padding:0 14px;font-weight:600;font-size:15px}
.chip.done{border:2px solid var(--pine);background:var(--pine);color:var(--on-pine)}
.chip.add{border-style:solid;color:var(--muted);font-weight:500}
.stepper{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.stepper button{width:36px;height:36px;border-radius:10px;border:0;background:var(--sunk);font-size:18px;color:var(--ink)}
.stepper b{min-width:30px;text-align:center;color:var(--ink);font-size:16px}
.wk{font-size:13px;color:var(--muted);margin-top:10px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pine);border-radius:3px}
.bar i.over{background:var(--amber)}

/* plan */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.plan-grid label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;line-height:1.3}
.plan-grid input{margin-top:4px;text-align:center;font-weight:600}
.tip{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14px;background:var(--sunk)}
.tip.up{background:var(--pine-soft)}
.tip.down,.tip.stop{background:var(--nerve-soft)}
.tip b{display:block;margin-bottom:2px}
.tip button{margin-top:8px;border:0;border-radius:10px;padding:8px 12px;background:var(--ink);color:var(--surface);font-weight:600;font-size:14px;min-height:40px}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stat{background:var(--sunk);border-radius:14px;padding:12px 14px}
.stat .v{font-size:24px;font-weight:700;line-height:1.1}
.stat .k{font-size:13px;color:var(--muted);margin-top:4px}
.stat .trend{font-size:13px;font-weight:600;margin-top:2px}
.trend.good{color:var(--pine)} .trend.bad{color:var(--nerve)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* exercises admin */
.exrow{border-top:1px solid var(--line);padding:14px 0}
.exrow:first-of-type{border-top:0}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
details.how{margin-top:6px;font-size:14px}
details.how summary,details.lib summary{cursor:pointer;list-style:none}
details.how summary::-webkit-details-marker,details.lib summary::-webkit-details-marker{display:none}
details.how summary{color:var(--pine);font-weight:600;padding:4px 0;display:inline-block}
details.how p,details.lib p{margin:6px 0}
.caution{color:var(--nerve);font-size:13.5px}
.stage h3{font-size:15px;margin:18px 0 2px;color:var(--pine)}
details.lib{border-top:1px solid var(--line);padding:12px 0}
.stage h3 + details.lib{border-top:0}
details.lib summary{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px}
details.lib summary::after{content:"+";font-weight:700;color:var(--muted);font-size:18px}
details.lib[open] summary::after{content:"–"}
details.lib summary b{display:block;font-weight:600}
details.lib summary small,label.pick small{display:block;color:var(--muted);font-size:13px}
details.lib p{font-size:14.5px}
details.lib .harder{background:var(--pine-soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
details.lib .harder b{display:block}
textarea.prompt{font-size:13px;min-height:130px;color:var(--muted)}
label.pick{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
label.pick input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pine)}
label.pick b{display:block;font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;background:var(--sunk)}
.btn.primary{background:var(--pine);color:var(--on-pine)}
.btn.danger{background:var(--nerve-soft);color:var(--nerve)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{border:1.5px solid var(--line);background:none;border-radius:20px;padding:8px 12px;font-size:14px;min-height:40px;text-align:left}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .btn{margin-top:12px}

.cathd{font-size:14px;color:var(--pine);margin:18px 0 0;font-weight:700}
.cathd + .ex{border-top:0;padding-top:6px}
.filt{display:flex;gap:6px;overflow-x:auto;margin:4px -2px 2px;padding:2px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;border:1.5px solid var(--line);background:none;border-radius:20px;padding:7px 13px;font-size:14px;min-height:38px;white-space:nowrap}
.filt button.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.seg.two button{flex:1 1 40%}
.tbtn{border:0;background:var(--pine-soft);color:var(--pine);font-weight:600;border-radius:12px;padding:9px 14px;margin-top:10px;min-height:44px;display:inline-flex;gap:8px;align-items:center;font-size:14px}
.timer{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:7;padding:0 10px 10px}
.timer .tin{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 14px;box-shadow:0 -6px 28px rgba(0,0,0,.16)}
.ttop{display:flex;gap:14px;align-items:center}
.tring{position:relative;width:92px;height:92px;flex:none;color:var(--pine)}
.tring svg{width:92px;height:92px;transform:rotate(-90deg);display:block}
.tring .tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:700}
.ph-rest .tring{color:var(--amber)} .ph-switch .tring{color:var(--muted)} .ph-work .tring,.ph-ready .tring{color:var(--sunk)}
.ph-done .tring{color:var(--pine)} .ph-done .tnum{color:var(--pine)}
.tinfo{flex:1;min-width:0}
.tphase{font-weight:700;font-size:17px;line-height:1.25}
.tname{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tset{font-size:13px;color:var(--muted)}
.tclose{align-self:flex-start;width:36px;height:36px;border-radius:12px;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.trest{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.trest span{margin-right:2px}
.trest button{border:0;border-radius:10px;background:var(--sunk);padding:6px 9px;min-height:34px;font-size:13px}
.trest button.on{background:var(--ink);color:var(--surface);font-weight:600}
.tacts{display:flex;gap:8px;margin-top:12px}
.tacts .btn{flex:1}
body.timing main{padding-bottom:300px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-height:56px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{color:var(--pine)}
.foot{font-size:12.5px;color:var(--muted);margin:16px 6px}
@media (prefers-reduced-motion:no-preference){ .chip,.seg button,.nerve .dot{transition:background .15s,border-color .15s,color .15s} }
.lvline{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:14px}
.lvtag{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 6px;border-radius:11px;background:var(--pine-soft);color:var(--pine);font-size:11px;font-weight:700}
.bandchip{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:3px 10px 3px 6px}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.45);flex:none}
.lvls{display:flex;gap:6px;flex-wrap:wrap}
.lv{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:none;font-weight:700;font-size:15px}
.lv.past{background:var(--pine-soft);border-color:var(--pine-soft);color:var(--pine)}
.lv.on{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.lvname{margin-top:10px;font-size:14px}
.lvname b{display:block;font-size:15.5px}
.lvname span{display:block;color:var(--muted);margin-top:2px}
.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bandbtn{border:1.5px solid var(--line);background:none;border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;min-height:64px}
.bandbtn .sw{width:22px;height:22px}
.bandbtn small{display:block;color:var(--muted);font-size:10.5px}
.bandbtn span{text-align:center;line-height:1.2}
.bandbtn.on{border-color:var(--ink);background:var(--sunk);font-weight:600}
ol.lvlist{margin:8px 0 12px;padding-left:22px}
ol.lvlist li{margin:8px 0;font-size:14px}
ol.lvlist li b{display:block;font-weight:600}
ol.lvlist li p{margin:2px 0 0;font-size:13.5px}
.lved{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.lvhd{display:flex;gap:8px;align-items:center}
.lved .toggle{min-height:38px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;font-size:14.5px}
.toast[hidden]{display:none}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;border:0;background:var(--bg);color:var(--ink);border-radius:11px;padding:8px 14px;font-weight:700;min-height:42px}
.toast .tbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pine);transform-origin:left}
.toast.go .tbar{animation:shrink 3s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
body.timing .toast{bottom:calc(290px + env(safe-area-inset-bottom,0px))}
.sheet{position:fixed;inset:0;z-index:20}
.sheet[hidden]{display:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,14,12,.5)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:86vh;overflow:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:rise .2s ease-out}}
@keyframes rise{from{transform:translateY(30px);opacity:.6}}
body.sheet-open{overflow:hidden}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.sh-head h2{margin:2px 0 0;font-size:19px}
.lvopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:none;border-radius:16px;padding:12px;margin-top:8px}
.lvopt.on{border-color:var(--pine);background:var(--pine-soft)}
.lvno{flex:none;width:30px;height:30px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700}
.lvopt.on .lvno,.lvrow.on .lvno{background:var(--pine);color:var(--on-pine)}
.lvtxt{flex:1;min-width:0}

const DIFFS = [["easy", "Занадто легко"], ["ok", "Саме те"], ["hard", "Важко"], ["fail", "Не зміг"]];
const SESNAMES = { 1: ["Тренування"], 2: ["Ранок", "Вечір"], 3: ["Ранок", "День", "Вечір"] };
function stepDown(ex, p0) {
  const p = normP(ex, p0), lvls = levelsOf(ex), lv = lvls[p.level], next = { ...p };
  if (p.band && bandIdx(p.band) > 0) next.band = BANDS[bandIdx(p.band) - 1][0];
  else if (p.reps > Math.ceil(lv.r * 0.6)) next.reps = Math.max(1, Math.round(p.reps * 0.8));
  else if (p.level > 0) { const L = lvls[p.level - 1]; Object.assign(next, { level: p.level - 1, sets: L.s, reps: L.r, band: L.b ? "yellow" : null }); }

  return next;
}
function todayItems(d) {

function itemState(it, sid) {

  const sets = sesSets(it.l, sid), fb = sesFb(it.l, sid);

}
function sesComplete(it, s) { return sesSets(it.l, s).length >= it.p.sets || !!sesFb(it.l, s).closed; }
function pickSession(items) {
  const maxPer = Math.max(1, ...items.filter(i => i.p && !i.quotaMet).map(i => i.perDay));
  for (let s = 0; s < maxPer; s++) if (items.some(i => ["todo", "rate"].includes(itemState(i, s)))) return s;
  return maxPer - 1;

function fbHTML(it, sid) {

function trainHTML(d) {

  const auto = pickSession(items);
  const maxPer = Math.max(1, ...items.filter(i => i.p && !i.quotaMet).map(i => i.perDay));

  const names = SESNAMES[maxPer] || SESNAMES[3];
  const sesChips = maxPer > 1 ? `<div class="sesbar" role="tablist">${names.map((nm, s) => {
    const its = items.filter(i => i.p && !i.quotaMet && s < i.perDay), ok = its.length && its.every(i => sesComplete(i, s));
    return `<button role="tab" aria-selected="${s === sid}" class="${s === sid ? "on" : ""} ${ok ? "ok" : ""}" data-act="session" data-v="${s}">${ok ? "✓ " : ""}${nm}<small>${its.length} ${its.length === 1 ? "вправа" : its.length > 1 && its.length < 5 ? "вправи" : "вправ"}</small></button>`;
  }).join("")}</div>` : "";
  const todo = [], rate = [], done = [], later = [];
  items.forEach(it => { const st = itemState(it, sid); (st === "todo" ? todo : st === "rate" ? rate : st === "done" ? done : later).push([it, st]); });
  const nowList = [...rate, ...todo];

    return `<details class="donerow" data-open="${k}" ${S.open.has(k) ? "open" : ""}><summary><span class="ck">✓</span><span><b>${esc(it.ex.name)}</b><small>${sets.join(" + ")}${uS(it.V.unit)}${fbt ? `, ${fbt}` : ""}</small></span></summary>

  }).join("");
  const reasons = { rest: it => `тижневий план виконано: ${it.otherDays} з ${it.p.days} днів`, later: it => `${it.perDay === 1 ? "1 раз" : it.perDay + " рази"} на день`, noplan: () => "немає плану на цей тиждень" };
  const laterRows = later.map(([it, st]) => `<div class="laterrow"><b>${esc(it.ex.name)}</b><small>${reasons[st](it)}</small>${st === "noplan" ? `<button class="mini" data-act="goplan">До плану</button>` : st === "rest" ? `<button class="mini" data-act="forcetoday" data-ex="${it.ex.id}">Все одно зробити</button>` : ""}</div>`).join("");

function weekHTML() {
  const w = S.week, exs = activeEx(), cw = monday(today()), future = w > cw;

  else {
    const next = addDays(w, 7);
    body = [...exs].sort((a, b) => catIdx(a) - catIdx(b)).map(ex => {
      const V = view(ex, w), p = V.p, st = weekStats(w, ex), sg = future ? null : suggest(w, ex), auto = ex.auto !== false;
      if (sg && sg.next) S.sugg[ex.id] = sg.next;
      const pct = st.pct == null ? 0 : Math.min(st.pct, 1.2);
      const pn = p ? normP(ex, { ...p, level: V.li, band: V.band }) : null;
      const g = ex.goal;

        const rd = roadmap(ex, pn);
        goalLine = `<button class="goalline" data-act="goalsheet" data-ex="${ex.id}">${TARGET_ICON}<span>Ціль: ${esc(planText(ex, normP(ex, g)))}<small>${goalReached(ex, pn) ? "досягнута" : rd.length ? etaText(rd.length) : ""}</small></span><span class="go">Змінити</span></button>`;
      }
      let tip = "";
      const unitW = V.unit === "sec" ? "с" : "повт.";
      const need = Math.ceil(st.planned * 0.85) - st.done;
      if (w === cw && p && sg && !["stop", "down", "goal"].includes(sg.kind)) {
        if (need > 0) tip = `<div class="tip"><b>До кроку вперед</b>Ще ${need} ${unitW} цього тижня (85% плану) без погіршення, і з ${fmtShort(next)} навантаження ${auto ? "зросте саме" : "можна буде збільшити"}.</div>`;
        else if (sg.next) tip = auto ? `<div class="tip up"><b>${sg.title}</b>План виконано. З ${fmtShort(next)} план зміниться сам: ${esc(planText(ex, sg.next))}.</div>` : `<div class="tip up"><b>${sg.title}</b>${sg.text}<br><button data-act="apply" data-ex="${ex.id}" data-week="${next}">Записати в план на ${fmtShort(next)}</button></div>`;
        else tip = `<div class="tip"><b>${sg.title}</b>${sg.text}</div>`;
      } else if (sg) {
        if (sg.next && auto && w === cw) tip = `<div class="tip ${sg.kind}"><b>${sg.title}</b>Якщо так і піде, з ${fmtShort(next)} план зміниться сам: ${esc(planText(ex, sg.next))}.</div>`;
        else if (sg.next && !auto) tip = `<div class="tip ${sg.kind}"><b>${sg.title}</b>${sg.text}<br><button data-act="apply" data-ex="${ex.id}" data-week="${next}">Записати в план на ${fmtShort(next)}</button></div>`;
        else if (sg.kind !== "wait" || !auto) tip = `<div class="tip ${sg.kind}"><b>${sg.title}</b>${sg.text}</div>`;
      } else if (future && auto && p && p.wk !== w) tip = `<div class="tip">План цього тижня підлаштується сам у понеділок, залежно від того, як пройде попередній.</div>`;
      return `<div class="card">
        <div class="pc-head"><div><div class="hint">${catName(catOf(ex))}</div><h2>${esc(ex.name)}</h2></div>
          <button class="autochip ${auto ? "on" : ""}" data-act="auto" data-ex="${ex.id}" aria-pressed="${auto}">${auto ? "Автопрогрес" : "Вручну"}</button></div>
        ${p && p.auto && p.wk === w ? `<div class="autonote">${p.auto === "down" ? "Зменшено" : "Збільшено"} автоматично за підсумками минулого тижня</div>` : ""}
        <div class="blk"><div class="blk-h">Рівень вправи</div>
        ${lvPickHTML(ex, V, w)}
        ${V.lvl.b ? `<div class="flabel" style="margin-top:14px">Резинка</div><div class="bands">${BANDS.map(b => `<button class="bandbtn ${V.band === b[0] ? "on" : ""}" data-act="pband" data-ex="${ex.id}" data-v="${b[0]}">${swatch(b[0])}<span>${b[1]}<small>${b[3]}</small></span></button>`).join("")}</div>` : ""}
        </div>
        <div class="blk"><div class="blk-h">Скільки робити</div>
        <div class="plan-grid">
          <label>Днів на тиждень<input class="inp num" type="number" inputmode="numeric" min="1" max="7" data-plan="days" data-ex="${ex.id}" value="${p?.days ?? ""}" placeholder="–"></label>
          <label>Разів на день<input class="inp num" type="number" inputmode="numeric" min="1" max="3" data-plan="perDay" data-ex="${ex.id}" value="${p ? (p.perDay || 1) : ""}" placeholder="–"></label>
          <label>Підходів<input class="inp num" type="number" inputmode="numeric" min="1" max="10" data-plan="sets" data-ex="${ex.id}" value="${p?.sets ?? ""}" placeholder="–"></label>
          <label>${V.unit === "sec" ? "Секунд" : "Повторень"}${V.perSide ? " на сторону" : ""}<input class="inp num" type="number" inputmode="numeric" min="1" max="600" data-plan="reps" data-ex="${ex.id}" value="${p?.reps ?? ""}" placeholder="–"></label>
        </div>
        ${p && !future ? `<div class="wk">Виконано за тиждень: ${st.done} з ${st.planned} ${V.unit === "sec" ? "с" : "повт."}, тренувань ${st.activeDays} з ${p.days}</div><div class="bar"><i class="${st.pct > 1.1 ? "over" : ""}" style="width:${Math.round(pct / 1.2 * 100)}%"></i></div>` : ""}
        </div>

    <div class="daynav">

      <div class="d"><b>${label}</b><span>${fmtShort(w)} – ${fmtShort(addDays(w, 6))}</span></div>
      <button class="iconbtn" data-act="nextweek" aria-label="Наступний тиждень"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>

    <p class="foot">«Автопрогрес» щопонеділка сам додає крок навантаження, якщо минулий тиждень пройшов добре, і відступає, якщо стало гірше. Детальніше у «Цілі й прогрес». Це орієнтир, а не призначення: узгоджуйте з фізіотерапевтом.</p>`;
}

function lineChart({ dates, series, yMax, ticks, tickLabels, invert = false, pl = 26, h = 170 }) {
  const W = 340, H = h, pr = 6, pt = 8, pb = 22, n = dates.length;
  const x = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1));
  const y = v => pt + (invert ? v / yMax : 1 - v / yMax) * (H - pt - pb);
  let g = ticks.map((t, i) => `<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${tickLabels ? tickLabels[i] : t}</text>`).join("");
  const xl = [0, Math.floor((n-1)/2), n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i => `<text x="${x(i)}" y="${H-4}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-size="10" fill="var(--muted)">${fmtShort(dates[i])}</text>`).join("");
  const paths = series.map(s => {
    let d = "", dots = "", prev = false;
    s.values.forEach((v, i) => {
      if (v == null) { prev = false; return; }
      d += (prev ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      const isolated = (i === 0 || s.values[i-1] == null) && (i === n-1 || s.values[i+1] == null);
      if (isolated || n <= 31) dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${isolated?3:2}" fill="${s.color}"/>`;
      prev = true;
    });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${paths}${xl}</svg>`;
}

function renderProgress() {
  const t = today(), n = S.range;
  const dates = Array.from({length: n}, (_, i) => addDays(t, i - n + 1));
  const val = f => dates.map(d => { const v = getDay(d).diary?.[f]; return typeof v === "number" ? v : null; });
  const last7 = dates.slice(-7), prev7 = Array.from({length:7}, (_, i) => addDays(t, i - 13));
  const legA = avg(diaryVals(last7, "legPain")), legB = avg(diaryVals(prev7, "legPain"));
  const backA = avg(diaryVals(last7, "backPain")), backB = avg(diaryVals(prev7, "backPain"));
  const trend = (a, b) => a == null || b == null ? "" : Math.abs(a-b) < 0.3 ? `<div class="trend">без змін</div>` : a < b ? `<div class="trend good">↓ на ${r1(b-a)} за тиждень</div>` : `<div class="trend bad">↑ на ${r1(a-b)} за тиждень</div>`;
  const anyData = dates.some(d => Object.keys(getDay(d).diary || {}).length);

  const cw = monday(t);
  const weeks = Array.from({length: 8}, (_, i) => addDays(cw, (i - 7) * 7));
  const wpct = weeks.map(w => { let done = 0, planned = 0; activeEx().forEach(ex => { const s = weekStats(w, ex); done += s.done; planned += s.planned * (w === cw ? weekDays(w).filter(d => d <= t).length / 7 : 1); }); return planned ? done / planned : null; });
  const BW = 340, BH = 150, bpl = 30, bpb = 22, bpt = 8, bw = (BW - bpl - 6) / 8;
  const by = v => bpt + (1 - Math.min(v, 1.4) / 1.4) * (BH - bpt - bpb);
  const bars = `<svg class="chart" viewBox="0 0 ${BW} ${BH}" role="img">
    ${[0, .5, 1].map(v => `<line x1="${bpl}" x2="${BW-6}" y1="${by(v)}" y2="${by(v)}" stroke="var(--line)" ${v===1?'stroke-dasharray="4 4"':''}/><text x="${bpl-6}" y="${by(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v*100}%</text>`).join("")}
    ${wpct.map((p, i) => p == null ? "" : `<rect x="${bpl + i*bw + bw*0.18}" y="${by(p)}" width="${bw*0.64}" height="${Math.max(0, by(0)-by(p))}" rx="4" fill="${p > 1.1 ? "var(--amber)" : "var(--pine)"}"/>`).join("")}
    ${weeks.map((w, i) => i % 2 === 1 || i === 7 ? `<text x="${bpl + i*bw + bw/2}" y="${BH-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtShort(w)}</text>` : "").join("")}
  </svg>`;

  $("#v-progress").innerHTML = `
    <div class="seg" style="margin:8px 0 4px">${[[14,"2 тижні"],[30,"Місяць"],[90,"3 місяці"]].map(([v,l])=>`<button data-act="range" data-v="${v}" class="${S.range===v?"on":""}">${l}</button>`).join("")}</div>
    <div class="card">
      <h2>Останні 7 днів</h2>

function parseImport(text) {
  const t = String(text || "").replace(/```(?:json)?/gi, "");

  const str = (v, n) => typeof v === "string" ? v.trim().slice(0, n) : "";

  const catP = v => { v = String(v || "").toLowerCase(); return /mob|рухлив|нерв|розтяж/.test(v) ? "mob" : /move|рух/.test(v) ? "move" : /act|актив/.test(v) ? "act" : /str|сил|витрив|закач/.test(v) ? "str" : ""; };
  const bandP = v => { v = String(v || "").toLowerCase(); return /yellow|žlut|zlut|жовт/.test(v) ? "yellow" : /red|červ|cerv|черв/.test(v) ? "red" : /green|zelen|зелен/.test(v) ? "green" : /blue|modr|син/.test(v) ? "blue" : /black|čern|cern|чорн|черн/.test(v) ? "black" : ""; };
  const lvOne = (x, fb) => { const u = unit(x.unit), bc = bandP(x.band_color ?? x.bandColor); const o = { n: str(x.name, 80) || fb, u, s: num(x.sets, 1, 10, 2), r: num(x.reps, 1, 600, u === "sec" ? 30 : 10), t: str(x.note, 600) }; if (x.band === true || bc) { o.b = true; if (bc) o.bc = bc; } return o; };
  const items = list.filter(x => x && str(x.name, 80)).slice(0, 30).map(x => {
    const name = str(x.name, 80);
    let levels = Array.isArray(x.levels) && x.levels.length ? x.levels.slice(0, 8).filter(Boolean).map(l => lvOne(l, "")).filter(l => l.n) : [];
    if (!levels.length) { levels = [lvOne(x, name)]; if (x.harder && str(x.harder.name, 80)) levels.push(lvOne(x.harder, "")); }

  });

}

async function exportCSV() {
  const exs = S.state.exercises;
  const head = ["Дата", "Біль у попереку", "Біль у нозі", "Куди віддає", "Оніміння", "Скутість", "Сон", "Самопочуття", "Ходьба, хв", "Знеболювальне", "Тривожні ознаки", "Нотатки", ...exs.map(e => e.name)];
  const q = v => { const s = String(v ?? ""); return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = Object.keys(S.days).sort().map(d => {
    const di = S.days[d].diary || {};
    const segv = f => typeof di[f] === "number" ? SEGS[f].opts[di[f]] : "";
    const cell = ex => {
      const l = (S.days[d].log || {})[ex.id]; if (!l || !l.sets || !l.sets.length) return "";
      const lv = levelsOf(ex)[l.level || 0] || {};
      return `${l.sets.join("+")}${uS(lv.u)} (р.${(l.level || 0) + 1}${l.band ? ", " + bandOf(l.band)[1].toLowerCase() : ""})`;
    };
    return [d, di.backPain, di.legPain, typeof di.reach === "number" ? REACH[di.reach][0] : "", segv("numb"), segv("stiff"), segv("sleep"), segv("mood"), di.walk, di.meds ? "так" : "",
      Object.keys(di.flags || {}).filter(k => di.flags[k]).map(k => (FLAGS.find(f => f[0] === k) || [0, k])[1]).join(" | "), di.notes,
      ...exs.map(cell)].map(q).join(",");
  });
  const csv = "\ufeff" + [head.map(q).join(","), ...rows].join("\n");
  try { await S.downloads.save({ filename: `shchodennyk-spyny-${today()}.csv`, data: csv }); }
  catch (err) { if (err && err.code !== "declined") alertMsg("Не вдалося підготувати файл."); }
}

  el.classList.remove("unset");
  const big = document.querySelector(`[data-big="${f}"]`); big.textContent = v; big.classList.remove("unset");
  document.querySelector(`[data-word="${f}"]`).textContent = PAINWORD(v);
  setDiary(f, v);
}
document.addEventListener("pointerup", e => { const el = e.target; if (el.dataset && el.dataset.range && el.classList.contains("unset")) applyRange(el); });
document.addEventListener("keyup", e => { const el = e.target; if (el.dataset && el.dataset.range && el.classList.contains("unset") && (e.key === "Enter" || e.key === " ")) applyRange(el); });

/* ---------- guided session ---------- */
function guideStart() {
  const items = todayItems(S.cur);
  const maxPer = Math.max(1, ...items.filter(i => i.p && !i.quotaMet).map(i => i.perDay));
  const sid = S.session != null && S.session < maxPer ? S.session : pickSession(items);
  const list = items.filter(it => ["todo", "rate"].includes(itemState(it, sid))).map(it => it.ex.id);
  if (!list.length) return;
  S.guide = { list, i: 0, sid, phase: "ex", maxPer, startDone: 0 };
  S.session = sid;
  if (T.on) { T.on = false; }
  $("#timer").hidden = true; document.body.classList.remove("timing");
  guideEnter();
}
function guideItem() { const G = S.guide; return G ? todayItems(S.cur).find(x => x.ex.id === G.list[G.i]) : null; }
function guideEnter() {
  const G = S.guide; if (!G) return;
  while (G.i < G.list.length) {
    const it = guideItem();
    if (it && it.p) {
      const st = itemState(it, G.sid);
      if (st === "done") { G.i++; continue; }
      if (st === "rate") { G.phase = "rate"; T.on = false; }
      else { G.phase = "ex"; Object.assign(T, { on: true, exId: it.ex.id, day: S.cur, sid: G.sid, phase: "ready", paused: false, side: 1, total: 0 }); }
      keepAwake(true); renderGuide(); return;
    }
    G.i++;
  }
  G.phase = "end"; T.on = false; keepAwake(false); renderGuide();
}
function guideNext() { const G = S.guide; if (!G) return; G.i++; guideEnter(); window.scrollTo(0, 0); $("#guide").scrollTop = 0; }
function guideClose() { S.guide = null; T.on = false; keepAwake(false); renderGuide(); drawTimer(); render(); }
function guideStageHTML(it) {
  const { ex, V, p } = it, sid = S.guide.sid, n = sesSets(it.l, sid).length;
  const draft = S.draft[ex.id] ?? p.reps ?? V.lvl.r, u = V.unit === "sec" ? "с" : "";
  const ph = T.on && T.exId === ex.id ? T.phase : "ready";
  const cd = ["hold", "switch", "rest"].includes(ph);
  const big = cd ? fmtT(remaining()) : ph === "work" ? fmtT((Date.now() - T.start) / 1000) : `${draft}${u}`;
  const off = cd && T.total ? RC * (1 - remaining() / T.total) : 0;
  const side = V.perSide ? (T.side === 1 ? ", перша сторона" : ", друга сторона") : "";
  const label = {
    ready: [`Підхід ${n + 1} з ${p.sets}`, V.unit === "sec" ? `Утримання ${draft} с${V.perSide ? " на кожну сторону" : ""}` : `${draft} повторень${V.perSide ? " на кожну сторону" : ""}`],
    hold: ["Тримайте" + side, `Підхід ${n + 1} з ${p.sets}`],
    switch: ["Змініть сторону", "Друга сторона почнеться сама"],
    work: [`Зробіть ${draft} повторень${V.perSide ? " на кожну сторону" : ""}`, `Підхід ${n + 1} з ${p.sets}. Натисніть, коли закінчите`],
    rest: ["Відпочинок", `Далі підхід ${n + 1} з ${p.sets}`],
  }[ph] || ["", ""];
  const acts = {
    ready: `<button class="btn primary g-big" data-act="tstart">Почати підхід ${n + 1}</button>`,
    hold: `<div class="g-acts"><button class="btn" data-act="tpause">${T.paused ? "Продовжити" : "Пауза"}</button><button class="btn primary" data-act="tfinish">Завершити</button></div>`,
    switch: `<div class="g-acts"><button class="btn" data-act="tpause">${T.paused ? "Продовжити" : "Пауза"}</button><button class="btn primary" data-act="tfinish">Почати зараз</button></div>`,
    work: `<button class="btn primary g-big" data-act="tdone">Підхід зроблено</button>`,
    rest: `<div class="g-acts"><button class="btn" data-act="tplus">+15 с</button><button class="btn primary" data-act="tskip">Пропустити</button></div><div class="trest" style="justify-content:center"><span>Відпочинок</span>${[30, 45, 60, 90].map(v => `<button data-act="trest" data-v="${v}" class="${restSec() === v ? "on" : ""}">${v} с</button>`).join("")}</div>`,
  }[ph] || "";
  return `<div class="g-stage ph-${ph}">
    <div class="g-ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle id="tring" cx="48" cy="48" r="42" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${cd ? off : ph === "ready" ? 0 : RC}"/></svg><div class="tnum num" id="tnum">${big}</div></div>
    <div class="g-phase">${label[0]}</div><div class="g-sub">${label[1]}</div>
    ${acts}
    ${ph === "ready" ? `<div class="stepper" style="justify-content:center"><button data-act="dec" data-ex="${ex.id}" aria-label="Менше">−</button><b class="num">${draft}</b><button data-act="inc" data-ex="${ex.id}" aria-label="Більше">+</button><span>${V.unit === "sec" ? "секунд" : "повторень"}</span></div>` : ""}
  </div>`;
}
function renderGuide() {
  const el = $("#guide"), G = S.guide;
  if (!G) { el.hidden = true; el.innerHTML = ""; document.body.classList.remove("guide-open"); return; }
  if (T.on && T.phase === "done") { T.on = false; G.phase = "rate"; }
  document.body.classList.add("guide-open"); el.hidden = false;
  const names = SESNAMES[G.maxPer] || SESNAMES[3], sesName = G.maxPer > 1 ? names[G.sid] : "Тренування";
  const total = G.list.length;
  const prog = G.list.map((_, k) => `<i class="${k < G.i || (k === G.i && G.phase === "rate") ? "done" : k === G.i && G.phase !== "end" ? "cur" : ""}"></i>`).join("");
  const top = `<div class="g-top"><button class="tclose" data-act="gclose" aria-label="Закрити тренування"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="g-prog">${prog}</div></div>`;
  let body;
  if (G.phase === "end") {
    const items = todayItems(S.cur), done = items.filter(it => it.p && !it.quotaMet && G.sid < it.perDay && sesComplete(it, G.sid));
    const sets = done.reduce((a, it) => a + sesSets(it.l, G.sid).length, 0);
    const hasNext = G.sid < G.maxPer - 1;
    body = `<div class="g-end">
      <div class="g-check">✓</div>
      <h1 class="g-name" style="text-align:center">${sesName} завершено</h1>
      <p class="g-sub" style="text-align:center">${done.length} ${done.length === 1 ? "вправа" : done.length < 5 ? "вправи" : "вправ"}, ${sets} ${sets === 1 ? "підхід" : sets < 5 ? "підходи" : "підходів"}</p>
      ${hasNext ? `<p class="hint" style="text-align:center">Наступне: ${names[G.sid + 1].toLowerCase()}.</p>` : ""}
      <div class="acts" style="flex-direction:column;margin-top:18px">
        <button class="btn primary g-big" data-act="gdiary">Відмітити самопочуття</button>
        <button class="btn g-big" data-act="gclose">Закрити</button>
      </div></div>`;
  } else {
    const it = guideItem();
    if (!it) { G.phase = "end"; return renderGuide(); }
    const { ex, V, p } = it, n = sesSets(it.l, G.sid).length;
    const dots = Array.from({ length: Math.max(p.sets, n) }, (_, k) => `<i class="${k < n ? "on" : ""}"></i>`).join("");
    body = `<div class="g-meta"><span>${sesName}, вправа ${G.i + 1} з ${total}</span>${G.phase === "ex" ? `<button class="g-skip" data-act="gskip">Пропустити</button>` : ""}</div>
      <div class="hint">${catName(catOf(ex))}</div>
      <h1 class="g-name">${esc(ex.name)}</h1>
      ${lvLine(ex, V, monday(S.cur))}
      <div class="g-row"><div class="g-target num">${p.sets} × ${p.reps}${uS(V.unit)}</div><div class="g-dots" aria-label="Зроблено ${n} з ${p.sets}">${dots}</div></div>
      ${G.phase === "rate" ? `<div class="g-stage" style="text-align:left">${fbHTML(it, G.sid)}</div>` : guideStageHTML(it)}
      ${G.phase === "ex" ? `<details class="how g-how" data-open="ghow" ${S.open.has("ghow") || !S.open.has("ghow-closed") ? "open" : ""}><summary>Як виконувати</summary>${V.equip ? `<p class="hint">Потрібно: ${esc(V.equip)}</p>` : ""}${V.lvl.t ? `<p>${esc(V.lvl.t)}</p>` : ""}${V.caution ? `<p class="caution">${esc(V.caution)}</p>` : ""}</details>` : ""}`;
  }
  el.innerHTML = `<div class="g-wrap">${top}${body}</div>`;
}

/* ---------- timer ---------- */
const T = { on: false };
let actx = null, wake = null;
function beep(f = 880, d = 0.12, vol = 0.25) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = f || 440;
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d + 0.03);
  } catch (e) {}
}
const buzz = pat => { try { navigator.vibrate && navigator.vibrate(pat); } catch (e) {} };
async function keepAwake(on) {
  try { if (on && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); else if (!on && wake) { await wake.release(); wake = null; } } catch (e) { wake = null; }
}
const tEx = () => S.state.exercises.find(x => x.id === T.exId);
const tPlan = () => planFor(monday(T.day))[T.exId] || null;
const tDone = () => sesSets(logOf(T.day, T.exId), T.sid || 0).length;
const restSec = () => S.state.rest || 45;
const fmtT = v => { v = Math.max(0, Math.ceil(v)); return `${Math.floor(v / 60)}:${pad(v % 60)}`; };
const RC = 2 * Math.PI * 42;
const tV = ex => view(ex, monday(T.day));
function draftFor(ex) { const V = tV(ex); return S.draft[ex.id] ?? (V.p && V.p.reps) ?? V.lvl.r; }
function remaining() { return T.paused ? T.rem : Math.max(0, (T.end - Date.now()) / 1000); }
function startTimer(exId) {
  if (!S.state.exercises.some(x => x.id === exId)) return;
  beep(440, 0.01, 0.0001);
  const it = todayItems(S.cur).find(i => i.ex.id === exId);
  Object.assign(T, { on: true, exId, day: S.cur, paused: false, side: 1, sid: S.session != null ? S.session : (it ? pickSession(todayItems(S.cur)) : 0) });
  keepAwake(true); beginSet();
}
function beginSet() {
  const ex = tEx(); if (!ex) return stopTimer();
  T.side = 1;
  if (tV(ex).unit === "sec") countdown("hold", draftFor(ex));
  else { T.phase = "work"; T.start = Date.now(); T.paused = false; T.total = 0; drawTimer(); }
}
function countdown(phase, sec) { T.phase = phase; T.total = sec; T.end = Date.now() + sec * 1000; T.paused = false; T.lastBeep = null; drawTimer(); }
function logFromTimer(v) {
  const ex = tEx();
  undoable(`Підхід записано: ${v}${ex ? uS(tV(ex).unit) : ""}`, [T.day], () => logSet(T.day, T.exId, v, T.sid || 0));
  if (S.tab === "today" && S.cur === T.day) renderToday();
}
function afterSet() {
  const p = tPlan();
  if (p && tDone() >= p.sets) { T.phase = "done"; beep(660, .15); setTimeout(() => beep(880, .3), 180); buzz([200, 100, 200]); drawTimer(); return; }
  countdown("rest", restSec());
}
function advance() {
  const ex = tEx(); if (!ex) return stopTimer();
  if (T.phase === "hold") {
    if (tV(ex).perSide && T.side === 1) { T.side = 2; T.held = T.total; countdown("switch", 5); }
    else { logFromTimer(T.total); afterSet(); }
  } else if (T.phase === "switch") countdown("hold", draftFor(ex));
  else if (T.phase === "rest") { T.phase = "ready"; drawTimer(); }
}
function stopTimer() { T.on = false; keepAwake(false); drawTimer(); }
function drawTimer() {
  if (S.guide) return renderGuide();
  const el = $("#timer");
  if (!T.on) { el.hidden = true; el.innerHTML = ""; document.body.classList.remove("timing"); return; }
  const ex = tEx(); if (!ex) { T.on = false; return drawTimer(); }
  const p = tPlan(), n = tDone(), of = p ? ` з ${p.sets}` : "";
  const V = tV(ex);
  const side = V.perSide ? (T.side === 1 ? ", перша сторона" : ", друга сторона") : "";
  const ph = {
    hold: ["Утримання" + side, `Підхід ${n + 1}${of}`],
    switch: ["Змініть сторону", `Підхід ${n + 1}${of}`],
    work: ["Робіть повторення", `Підхід ${n + 1}${of}, мета ${draftFor(ex)}${V.perSide ? " на кожну сторону" : ""}`],
    rest: ["Відпочинок", `Зроблено ${n}${of}`],
    ready: ["Наступний підхід", `Зроблено ${n}${of}`],
    done: ["Вправу виконано", `Оцініть її в картці вправи`],
  }[T.phase];
  const cd = ["hold", "switch", "rest"].includes(T.phase);
  const big = cd ? fmtT(remaining()) : T.phase === "work" ? fmtT((Date.now() - T.start) / 1000) : T.phase === "done" ? "✓" : `${draftFor(ex)}${V.unit === "sec" ? "с" : ""}`;
  const off = cd && T.total ? RC * (1 - remaining() / T.total) : 0;
  const btns = {
    hold: `<button class="btn" data-act="tpause">${T.paused ? "Продовжити" : "Пауза"}</button><button class="btn primary" data-act="tfinish">Завершити</button>`,
    switch: `<button class="btn" data-act="tpause">${T.paused ? "Продовжити" : "Пауза"}</button><button class="btn primary" data-act="tfinish">Почати зараз</button>`,
    work: `<button class="btn primary" data-act="tdone">Підхід зроблено</button>`,
    rest: `<button class="btn" data-act="tplus">+15 с</button><button class="btn primary" data-act="tskip">Пропустити</button>`,
    ready: `<button class="btn primary" data-act="tstart">Почати підхід ${n + 1}</button>`,
    done: `<button class="btn" data-act="tstart">Ще підхід</button><button class="btn primary" data-act="tclose">Готово</button>`,
  }[T.phase];
  const restSel = ["rest", "ready", "work"].includes(T.phase) ? `<div class="trest"><span>Відпочинок</span>${[30, 45, 60, 90].map(v => `<button data-act="trest" data-v="${v}" class="${restSec() === v ? "on" : ""}">${v} с</button>`).join("")}</div>` : "";
  el.className = "timer ph-" + T.phase;
  el.innerHTML = `<div class="tin" role="timer" aria-live="polite">
    <div class="ttop">
      <div class="tring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--sunk)" stroke-width="7"/><circle id="tring" cx="48" cy="48" r="42" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${off}"/></svg><div class="tnum num" id="tnum">${big}</div></div>
      <div class="tinfo"><div class="tphase">${ph[0]}</div><div class="tname">${esc(ex.name)}${V.lvls.length > 1 ? `, рівень ${V.li + 1}` : ""}${V.band ? `, ${bandOf(V.band)[1].toLowerCase()} резинка` : ""}</div><div class="tset">${ph[1]}</div></div>
      <button class="tclose" data-act="tclose" aria-label="Зупинити таймер"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    ${restSel}
    <div class="tacts">${btns}</div>
  </div>`;
  el.hidden = false; document.body.classList.add("timing");
}
function tick() {
  if (!T.on) return;
  if (["hold", "switch", "rest"].includes(T.phase)) {
    if (T.paused) return;
    const r = remaining(), sec = Math.ceil(r);
    if (sec <= 3 && sec > 0 && T.lastBeep !== sec) { T.lastBeep = sec; beep(T.phase === "rest" ? 520 : 740, .08); }
    if (r <= 0) { beep(T.phase === "rest" ? 988 : 1046, .35); buzz(300); advance(); return; }
    const num = $("#tnum"), ring = $("#tring");
    if (num) num.textContent = fmtT(r);
    if (ring && T.total) ring.setAttribute("stroke-dashoffset", RC * (1 - r / T.total));
  } else if (T.phase === "work") { const num = $("#tnum"); if (num) num.textContent = fmtT((Date.now() - T.start) / 1000); }
}
setInterval(tick, 200);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && T.on) { wake = null; keepAwake(true); tick(); } });

// keep "today" fresh after midnight
setInterval(() => { const t = today(); if (S._t && S._t !== t && S.cur === S._t) { S.cur = t; if (S.tab === "today") softRender(); } S._t = t; }, 60000);
S._t = today();

Store.init();
})();
</script>
